
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Lovey ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:#000;
font-family:Georgia,serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:white;
}
.box{
width:340px;
background:#111;
border:2px solid #ff4da6;
border-radius:22px;
box-shadow:0 0 25px #ff4da6;
padding:20px;
position:relative;
z-index:10;
}
.title{
text-align:center;
color:#ff69b4;
font-size:22px;
margin-bottom:15px;
}
#typing{
min-height:180px;
line-height:1.8;
font-size:17px;
}
#typing::after{
content:"|";
animation:blink .8s infinite;
color:#ff4da6;
}
@keyframes blink{
50%{opacity:0;}
}
#question,#replyPage{
display:none;
text-align:center;
}
button{
padding:12px 22px;
border:none;
border-radius:25px;
font-size:16px;
font-weight:bold;
margin:8px;
cursor:pointer;
}
#yes{
background:#ff2d75;
color:white;
}
#no{
background:#444;
color:white;
position:relative;
}
textarea{
width:100%;
height:110px;
margin-top:15px;
background:#1b1b1b;
color:white;
border:1px solid #ff4da6;
border-radius:12px;
padding:10px;
resize:none;
}
#send{
width:100%;
background:#ff2d75;
color:white;
margin-top:12px;
}
.heart{
position:fixed;
z-index:9999;
pointer-events:none;
animation:float 6s linear forwards;
}
@keyframes float{
0%{transform:translateY(100vh) scale(.8);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-120vh) scale(1.4);opacity:0;}
}
</style>
</head>

<body>

<div class="box">

<div class="title">❤️ A Special Surprise For Lovey ❤️</div>

<div id="typing"></div>

<div id="question">
<h2 style="color:#ff69b4;">Lovey... ❤️</h2>
<p style="margin:12px 0;">Will You Be My Girlfriend? 💖</p>

<button id="yes">YES ❤️</button>
<button id="no">NO 🙈</button>
</div>

<div id="replyPage">
<h1 style="color:#ff69b4;">LOVEY ❤️</h1>

<p style="line-height:1.8;margin-top:10px;">
You just made me the happiest person.

Thank you for saying YES.

You always make me smile.

❤️ With love,<br><b>Lex</b>
</p>

<h3 style="margin-top:20px;color:#ff69b4;">Tell me how you feel 💌</h3>

<textarea id="reply"
placeholder="Write your answer here..."></textarea>

<button id="send">Send ❤️</button>

<p id="thanks" style="display:none;color:#ff69b4;margin-top:10px;">
Thank you, Lovey. ❤️
</p>
</div>

</div>

<script>
const message=`Hey Lovey... ❤️

I made this little surprise just for you.

I don't know if I've ever said this enough...

You make me genuinely happy.

Whenever I think about you,
I smile without even trying.

So there is one question
I want to ask you...`;

let i=0;
const typing=document.getElementById("typing");

(function write(){
if(i<message.length){
typing.innerHTML+=message[i]=="\n"?"<br>":message[i];
i++;
setTimeout(write,45);
}else{
document.getElementById("question").style.display="block";
}
})();

function heart(){
const h=document.createElement("div");
h.className="heart";
const list=["💖","❤️","💕","💗","💞"];
h.innerHTML=list[Math.floor(Math.random()*list.length)];
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*20)+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}

setInterval(heart,350);

document.getElementById("yes").onclick=function(){
document.getElementById("typing").style.display="none";
document.getElementById("question").style.display="none";
document.getElementById("replyPage").style.display="block";

for(let x=0;x<80;x++){
setTimeout(heart,x*25);
}
};

const no=document.getElementById("no");
function runAway(){
no.style.left=(Math.random()*160-80)+"px";
no.style.top=(Math.random()*60-30)+"px";
}
no.onmouseover=runAway;
no.onclick=runAway;

document.getElementById("send").onclick=function(){
const reply=document.getElementById("reply").value.trim();

if(reply===""){
alert("Please write something first ❤️");
return;
}

document.getElementById("thanks").style.display="block";
};
</script>

</body>
</html>
